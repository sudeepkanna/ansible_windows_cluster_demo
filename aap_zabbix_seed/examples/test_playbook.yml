---
- name: Callback POC
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Print only approved test metadata
      ansible.builtin.debug:
        msg: "{{ awx_job_id }} / {{ awx_job_template_name }} / {{ awx_inventory_name }} / {{ domain_id }}"
    - name: Generate changed result
      ansible.builtin.command: /bin/true
      changed_when: true
    - name: Generate skipped result
      ansible.builtin.debug:
        msg: skipped
      when: false
